name: Keep Streamlit App Awake

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 后台手动点击 "Run workflow" 测试

permissions:
  contents: write

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push empty commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep streamlit app awake [skip ci]"
          git push
